name: daily-analysis

run-name: >-
  Daily analysis · ${{ inputs.profileId || 'manual' }} · ${{ inputs.slotId || inputs.requestId || github.run_id }}${{ inputs.scheduledFor && format(' · {0}', inputs.scheduledFor) || '' }}

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "逗号分隔的股票代码（留空使用网页保存的每日清单）"
        required: false
        default: ""
      requestId:
        description: "手动研究请求 UUID"
        required: false
        default: ""
      analysts:
        description: "逗号分隔的分析师白名单"
        required: false
        default: ""
      researchDepth:
        description: "研究深度：standard 或 deep"
        required: false
        default: ""
      profileId:
        description: "Monitor Worker 研究配置 ID"
        required: false
        default: ""
      slotId:
        description: "Monitor Worker 确定性计划槽 ID"
        required: false
        default: ""
      scheduledFor:
        description: "Monitor Worker 原始计划时间（ISO 8601）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # 同一时刻只允许一个报告生产者选择版本目录并回写 main。
  group: report-analysis-persistence
  cancel-in-progress: false

jobs:
  analyze-and-persist:
    runs-on: ubuntu-latest
    # 清单上限为 10，分析按标的顺序执行；为满清单预留足够时间。
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      TRADINGAGENTS_PROFILE_ID: ${{ inputs.profileId || '' }}
      TRADINGAGENTS_SLOT_ID: ${{ inputs.slotId || '' }}
      TRADINGAGENTS_SCHEDULED_FOR: ${{ inputs.scheduledFor || '' }}
      TRADINGAGENTS_ANALYSTS: ${{ inputs.analysts || vars.TRADINGAGENTS_ANALYSTS || 'market,news,fundamentals' }}
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${{ inputs.researchDepth == 'deep' && '2' || '1' }}
      TRADINGAGENTS_MAX_RISK_ROUNDS: ${{ inputs.researchDepth == 'deep' && '2' || '1' }}
      # ── LLM 后端（仓库 Variables 可覆盖）─────────────────────────
      TRADINGAGENTS_LLM_PROVIDER: ${{ vars.TRADINGAGENTS_LLM_PROVIDER || 'deepseek' }}
      TRADINGAGENTS_DEEP_THINK_LLM: ${{ vars.TRADINGAGENTS_DEEP_THINK_LLM || 'deepseek-v4-pro' }}
      TRADINGAGENTS_QUICK_THINK_LLM: ${{ vars.TRADINGAGENTS_QUICK_THINK_LLM || 'deepseek-v4-flash' }}
      TRADINGAGENTS_LLM_BACKEND_URL: ${{ vars.TRADINGAGENTS_LLM_BACKEND_URL }}
      TRADINGAGENTS_OUTPUT_LANGUAGE: ${{ vars.TRADINGAGENTS_OUTPUT_LANGUAGE || '中文' }}
      PAGES_URL: https://tradingagents-board.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 的 GITHUB_SHA 固定在触发时刻；排队后开跑时 main 可能已
          # 被前一个 run 提交过数据，必须检出运行时的最新分支头
          ref: main

      - name: Resolve daily ticker list
        env:
          MANUAL_TICKERS: ${{ inputs.tickers || '' }}
          REQUEST_ID: ${{ inputs.requestId || '' }}
          REQUESTED_ANALYSTS: ${{ inputs.analysts || vars.TRADINGAGENTS_ANALYSTS || 'market,news,fundamentals' }}
          RESEARCH_DEPTH: ${{ inputs.researchDepth || 'standard' }}
          ANALYSIS_CAPABILITIES: ${{ vars.ANALYSIS_CAPABILITIES || '' }}
          MONITOR_PROFILE_ID: ${{ inputs.profileId || '' }}
          MONITOR_SLOT_ID: ${{ inputs.slotId || '' }}
          MONITOR_SCHEDULED_FOR: ${{ inputs.scheduledFor || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import {
            enforceAnalysisWorkload,
            normalizeAnalysts,
            normalizeRequestId,
            normalizeResearchDepth,
            researchDepthRounds,
          } from "./functions/api/_analysis_request.mjs";
          import {
            normalizeWorkbenchTickers,
            parseWorkbenchSettings,
          } from "./functions/api/_workbench_settings.mjs";

          const manual = process.env.MANUAL_TICKERS.trim();
          let tickers;
          if (manual) {
            tickers = normalizeWorkbenchTickers(manual);
            console.log("using workflow_dispatch ticker override");
          } else {
            const raw = await readFile("public/data/workbench-settings.json", "utf8");
            tickers = parseWorkbenchSettings(JSON.parse(raw)).tickers;
            console.log("using saved workbench ticker list");
          }
          const requestId = normalizeRequestId(
            process.env.REQUEST_ID,
            { generate: false },
          );
          const analysts = normalizeAnalysts(process.env.REQUESTED_ANALYSTS, {
            capabilities: process.env.ANALYSIS_CAPABILITIES,
          });
          const researchDepth = normalizeResearchDepth(process.env.RESEARCH_DEPTH);
          // The workload guard protects the new ad-hoc research endpoint.
          // Scheduled monitor runs retain their existing 10-symbol contract.
          if (requestId) enforceAnalysisWorkload(tickers.length, researchDepth);
          const rounds = researchDepthRounds(researchDepth);
          const value = tickers.join(",");
          await appendFile(
            process.env.GITHUB_ENV,
            [
              `TRADINGAGENTS_TICKERS=${value}`,
              `TRADINGAGENTS_ANALYSTS=${analysts.join(",")}`,
              `TRADINGAGENTS_MAX_DEBATE_ROUNDS=${rounds}`,
              `TRADINGAGENTS_MAX_RISK_ROUNDS=${rounds}`,
              `TRADINGAGENTS_REQUEST_ID=${requestId}`,
              `TRADINGAGENTS_REQUEST_KIND=${
                requestId ? "adhoc" : process.env.MONITOR_PROFILE_ID ? "monitor" : "manual"
              }`,
              `TRADINGAGENTS_RESEARCH_DEPTH=${researchDepth}`,
              "",
            ].join("\n"),
            "utf8",
          );
          console.log(`resolved tickers: ${value}`);
          NODE

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run multi-agent analysis
        id: analysis
        continue-on-error: true
        # 密钥仅交给实际调用外部服务的本仓库脚本，不暴露给 checkout/setup 等 action。
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          EVIDENCE_API_URL: https://tradingagents-board.pages.dev/api/v1/evidence
          EVIDENCE_WRITE_TOKEN: ${{ secrets.EVIDENCE_WRITE_TOKEN }}
        run: |
          python scripts/run_daily.py

      - name: Persist reports to main
        if: ${{ always() }}
        run: |
          bash scripts/persist_reports.sh "chore(data): 更新分析报告 $(date -u +%F) [skip ci]"

      - name: Fail when analysis failed
        if: ${{ steps.analysis.outcome == 'failure' }}
        run: exit 1

  deploy-github-pages:
    needs: analyze-and-persist
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: analyze-and-persist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare-workbench
      cancel-in-progress: true
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tradingagents-board' }}
    steps:
      # 持久化完成后重新读取 main，部署内容与 Git 中的权威状态一致。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; production deployment is skipped."
          fi

      - name: Test Pages Functions contracts
        run: npm run test:functions

      - name: Deploy CN mirror to Cloudflare Pages
        if: ${{ steps.cloudflare.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.113.0 pages deploy public --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
