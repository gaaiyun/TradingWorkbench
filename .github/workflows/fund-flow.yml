name: fund-flow

on:
  schedule:
    - cron: "17 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection mode"
        required: true
        default: backfill
        type: choice
        options:
          - backfill
          - daily

permissions:
  contents: read

concurrency:
  group: fund-flow
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.FUND_FLOW_COLLECTION_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check collection credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare D1 credentials are required."
            exit 1
          fi

      - name: Collect fund flow data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/collect-fund-flows.mjs --mode=${{ github.event_name == 'schedule' && 'daily' || inputs.mode }}
