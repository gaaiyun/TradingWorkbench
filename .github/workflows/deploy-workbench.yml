name: deploy-workbench

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "migrations/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workbench
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tradingagents-board' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 排队期间 main 可能前进，始终部署 job 启动时的权威分支头。
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are required."
            exit 1
          fi

      - name: Test Pages Functions contracts
        run: npm run test:functions

      - name: Apply workbench database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.113.0 d1 migrations apply
          tradingagents-workbench
          --remote
          --config wrangler.toml

      - name: Deploy workbench and Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.113.0 pages deploy public --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
