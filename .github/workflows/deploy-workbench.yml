name: deploy-workbench

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "migrations/**"
      - "package.json"
      - "scripts/deployment-metadata.mjs"
      - "wrangler.toml"
      - ".github/workflows/deploy-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workbench
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tradingagents-board' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 排队期间 main 可能前进，始终部署 job 启动时的权威分支头。
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are required."
            exit 1
          fi

      - name: Test Pages Functions contracts
        run: npm run test:functions

      - name: Apply workbench database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.113.0 d1 migrations apply
          tradingagents-workbench
          --remote
          --config wrangler.toml

      - name: Resolve deployment revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate deployment manifest
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_BRANCH: main
        run: node scripts/deployment-metadata.mjs

      - name: Deploy workbench and Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: >-
          npx --yes wrangler@4.113.0 pages deploy public
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "$DEPLOY_SHA"
          --commit-dirty=false

      - name: Verify deployed Pages identity
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          health_url="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/api/health"
          for attempt in $(seq 1 12); do
            health_json="$(curl --fail --silent --show-error "${health_url}?attempt=${attempt}" || true)"
            if HEALTH_JSON="$health_json" DEPLOY_SHA="$DEPLOY_SHA" node --input-type=module -e '
              const health = JSON.parse(process.env.HEALTH_JSON || "{}");
              const deployedAt = health?.deployment?.deployedAt;
              process.exit(
                health?.deployment?.commitSha === process.env.DEPLOY_SHA
                && typeof deployedAt === "string"
                && Number.isFinite(Date.parse(deployedAt))
                ? 0 : 1
              );
            '; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages production alias did not expose the deployed commit SHA."
          exit 1
