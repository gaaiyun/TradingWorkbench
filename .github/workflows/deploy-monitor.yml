name: deploy-monitor

on:
  push:
    branches: [main]
    paths:
      - "workers/monitor/**"
      - "migrations/**"
      - "tests/test_monitor_reliability.mjs"
      - "tests/test_monitor_slots.mjs"
      - "tests/test_monitor_worker.mjs"
      - "wrangler.monitor.toml"
      - ".github/workflows/deploy-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-monitor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured; monitor deployment was skipped."
          fi

      - name: Test monitor contracts
        run: >-
          node --test
          tests/test_monitor_reliability.mjs
          tests/test_monitor_slots.mjs
          tests/test_monitor_worker.mjs

      - name: Apply monitor database migrations
        if: ${{ steps.cloudflare.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.113.0 d1 migrations apply
          tradingagents-workbench
          --remote
          --config wrangler.monitor.toml

      - name: Deploy monitor worker with version identity
        if: ${{ steps.cloudflare.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          npx --yes wrangler@4.113.0 deploy \
            --config wrangler.monitor.toml \
            --var WORKER_COMMIT_SHA:"$GITHUB_SHA" \
            --var WORKER_DEPLOYED_AT:"$deployed_at"
