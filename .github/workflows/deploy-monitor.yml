name: deploy-monitor

on:
  push:
    branches: [main]
    paths:
      - "workers/monitor/**"
      - "migrations/**"
      - "tests/test_monitor_reliability.mjs"
      - "tests/test_monitor_slots.mjs"
      - "tests/test_monitor_worker.mjs"
      - "wrangler.monitor.toml"
      - ".github/workflows/deploy-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workbench
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are required."
            exit 1
          fi
          if [ -z "$MONITOR_WORKER_URL" ]; then
            echo "::error::MONITOR_WORKER_URL is required for post-deploy verification."
            exit 1
          fi

      - name: Test monitor contracts
        run: >-
          node --test
          tests/test_monitor_reliability.mjs
          tests/test_monitor_slots.mjs
          tests/test_monitor_worker.mjs

      - name: Apply monitor database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.113.0 d1 migrations apply
          tradingagents-workbench
          --remote
          --config wrangler.monitor.toml

      - name: Deploy monitor worker with version identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          npx --yes wrangler@4.113.0 deploy \
            --config wrangler.monitor.toml \
            --var WORKER_COMMIT_SHA:"$GITHUB_SHA" \
            --var WORKER_DEPLOYED_AT:"$deployed_at"

      - name: Verify deployed monitor identity
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
        run: |
          health_json="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "${MONITOR_WORKER_URL%/}/health"
          )"
          HEALTH_JSON="$health_json" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_JSON);
            if (health?.deployment?.commitSha !== process.env.GITHUB_SHA) {
              throw new Error("deployed monitor commit SHA does not match");
            }
          '
